name: Docker

on:
  push:
    branches: [main]
    paths: ['taskflow-back/**', 'taskflow-web/**', 'docker-compose.yml', '.github/workflows/docker.yml']
  pull_request:
    paths: ['taskflow-back/**', 'taskflow-web/**', 'docker-compose.yml', '.github/workflows/docker.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Only used to interpolate the Compose file; never a real secret.
      JWT_SECRET: ci-only-placeholder-not-used-at-runtime
    steps:
      - uses: actions/checkout@v7
      - name: Validate the Compose file
        run: docker compose --env-file .env.example config --quiet
      - name: Build the images
        run: docker compose --env-file .env.example build
