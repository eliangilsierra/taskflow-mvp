name: Frontend

on:
  push:
    branches: [main]
    paths: ['taskflow-web/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['taskflow-web/**', '.github/workflows/web.yml']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: taskflow-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: taskflow-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:ci
      - run: npm run build
