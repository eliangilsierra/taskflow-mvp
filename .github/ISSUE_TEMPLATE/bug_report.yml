name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See the error
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Backend API, Web app, Docker / setup, Documentation]
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser, Java and Node versions, or Docker version.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: shell
