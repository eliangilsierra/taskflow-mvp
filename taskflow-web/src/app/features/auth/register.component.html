<section class="card auth-card">
  <h2>Create your account</h2>
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label class="field">
      <span>Name</span>
      <input type="text" formControlName="displayName" autocomplete="name" />
      @if (form.controls.displayName.touched && form.controls.displayName.invalid) {
        <small class="field-error">Enter your name (up to 80 characters).</small>
      }
    </label>

    <label class="field">
      <span>Email</span>
      <input type="email" formControlName="email" autocomplete="email" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <small class="field-error">Enter a valid email address.</small>
      }
    </label>

    <label class="field">
      <span>Password</span>
      <input type="password" formControlName="password" autocomplete="new-password" />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <small class="field-error">Use between 8 and 72 characters.</small>
      }
    </label>

    @if (error()) {
      <p class="alert alert-error" role="alert">{{ error() }}</p>
    }

    <button type="submit" class="btn btn-primary" [disabled]="submitting()">
      {{ submitting() ? 'Creating account…' : 'Create account' }}
    </button>
  </form>
  <p class="muted">Already registered? <a routerLink="/login">Sign in</a></p>
</section>
