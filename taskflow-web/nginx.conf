server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location /api/ {
    proxy_pass http://back:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Build output is content-hashed, so it can be cached for a long time.
  # Note: `expires` (unlike `add_header`) keeps the security headers above.
  location ~* \.(?:js|css|ico)$ {
    expires 1y;
  }

  # index.html must always be revalidated so new releases are picked up.
  location / {
    expires -1;
    try_files $uri $uri/ /index.html;
  }
}
